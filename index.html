<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Pool Trading Simulator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Dark Pool Trading Simulator</h1>
    <button id="connect-wallet">Connect Phantom Wallet</button>
    <div id="wallet-status"></div>
    <div class="game-section">
      <h2>Simulate a Trade</h2>
      <label>Buy/Sell:
        <select id="trade-type">
          <option>Buy</option>
          <option>Sell</option>
        </select>
      </label>
      <label>Amount:
        <input type="number" id="trade-amount" value="10" min="1" />
      </label>
      <label>Expected Price:
        <input type="number" id="trade-price" value="100" min="1" />
      </label>
      <button id="trade-btn">Execute Trade</button>
      <div id="trade-result"></div>
      <div id="trade-history"></div>
    </div>
    <div class="leaderboard-section">
      <h2>Leaderboard</h2>
      <ul id="leaderboard"></ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
  </html>
